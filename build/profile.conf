# VeyraOS build profile — sourced by build/build-iso.sh (bash syntax).
# Everything that identifies a release lives here so builds are reproducible.

VEYRA_NAME="VeyraOS"
VEYRA_ID="veyraos"
VEYRA_VERSION="2026.11"
VEYRA_CODENAME="Aurora"
VEYRA_CHANNEL="rc1"                       # rc1, rc2, stable ...
ISO_LABEL="VEYRA_202611"                  # must match the live boot label (<= 32 chars, no spaces)
ISO_PUBLISHER="VeyraOS Project"
ISO_APPLICATION="VeyraOS Live/Install Medium"

# Kernels shipped. The first is the default boot entry; the second is a
# fallback/recovery kernel. NVIDIA modules are built for each via DKMS.
KERNELS=(linux linux-lts)

# Live session
LIVE_USER="veyra"
LIVE_HOSTNAME="veyraos"
LIVE_LOCALE="en_US.UTF-8"
LIVE_TIMEZONE="UTC"
LIVE_KEYMAP="us"

# Package manifests (order matters only for readability)
PACKAGE_LISTS=(base desktop apps fonts nvidia gaming live installer)

# Local VeyraOS packages built from pkgbuilds/ (in build order).
# Packages listed in OPTIONAL_LOCAL_PKGS may fail to build without failing the ISO.
LOCAL_PKGS=(veyra-branding veyra-system veyra-desktop veyra-nvidia veyra-gaming veyra-apps veyra-live veyra-installer)
OPTIONAL_LOCAL_PKGS=(veyra-kwin-rounded-corners)

# Squashfs compression (zstd gives the best decompression speed for live boot)
SQUASHFS_OPTS=(-comp zstd -Xcompression-level 19 -b 1M -noappend -no-xattrs)

# Kernel command line for live boot (installed system: see installer config)
LIVE_CMDLINE="quiet splash loglevel=3 rd.udev.log_level=3 nvidia_drm.modeset=1 nvidia_drm.fbdev=1"
