# mkinitcpio configuration for the VeyraOS LIVE medium only.
# The installed system uses /etc/mkinitcpio.conf.
MODULES=()
BINARIES=()
FILES=()
# block: USB/SATA/NVMe/optical drivers; veyralive: find + mount the medium.
# No 'autodetect': the live initramfs must work on any hardware.
HOOKS=(base udev modconf kms keyboard keymap block veyralive)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
