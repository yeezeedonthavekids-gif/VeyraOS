---
overwrite: false
prefer_grub_d: false
keep_distributor: false
# nvidia_drm.* are ignored on systems without NVIDIA; nvidia-setup removes
# the driver there anyway.
kernel_params: [ "quiet", "splash", "loglevel=3", "nvidia_drm.modeset=1", "nvidia_drm.fbdev=1" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: false
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_DISABLE_RECOVERY: false
always_use_defaults: false
