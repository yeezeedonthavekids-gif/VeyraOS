# Disk setup. Supports: install alongside an existing OS (e.g. Windows,
# by shrinking a partition), replace a partition, erase a disk, or manual
# partitioning. NOTHING is preselected — the user must choose explicitly.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 32MiB
    label: "EFI"

# zram (compressed RAM swap) is enabled by default, so no swap partition is
# needed. A swap file/partition is only required for hibernation.
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: none

# LUKS1: GRUB can unlock it (encrypted /boot) on every firmware.
luksGeneration: luks1
enableLuksAutomatedPartitioning: true

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: false
initialPartitioningChoice: none

# btrfs: instant Timeshift restore points (@ and @home subvolumes) and
# transparent compression. ext4 and xfs remain available.
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]

essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: true
