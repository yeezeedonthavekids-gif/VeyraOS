# OpenRC system: no systemd tools. Calamares' "systemd" option runs
# systemd-machine-id-setup, which does not exist on VeyraOS, so it is off.
# D-Bus gets its machine id from dbus-uuidgen; /etc/machine-id is created
# from it by the VeyraOS post-install step.
---
systemd: false
dbus: true
dbus-symlink: false
entropy-copy: false
entropy-files:
    - /var/lib/seedrng/seed.credit
