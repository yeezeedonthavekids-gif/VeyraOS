# GRUB defaults that grubcfg does not manage (theme, other OS detection).
---
dontChroot: false
timeout: 120
script:
    - "/usr/lib/veyra/grub-defaults"
    # Kernels on the EFI partition (GRUB reads FAT reliably; reading them from
    # btrfs failed on real hardware). Runs after initcpio, before grub-mkconfig.
    - "/usr/lib/veyra/esp-kernels enable"
