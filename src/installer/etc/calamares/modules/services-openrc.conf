# Final service state of the installed system (OpenRC).
---
initdDir: /etc/init.d
runlevelsDir: /etc/runlevels
services:
    - name: veyra-zram
      runlevel: boot
    - name: elogind
      runlevel: boot
    - name: dbus
      mandatory: true
    - name: NetworkManager
      mandatory: true
    - name: veyra-firewall
      mandatory: true
    - name: bluetoothd
    - name: cronie
    - name: chronyd
    - name: openntpd
    - name: ntpd
    - name: veyra-firstboot
    - name: sddm
    - name: displaymanager
disable:
    - name: veyra-live
