# Offline: only removes live-medium packages; never needs the network.
---
backend: pacman
skip_if_no_internet: false
update_db: false
update_system: false
pacman:
    num_retries: 0
    disable_download_timeout: false
    needed_only: false
operations:
    - try_remove:
        - veyra-live
        - calamares
        - veyra-installer
        - veyra-calamares
        - testdisk
        - ddrescue
        - gparted
