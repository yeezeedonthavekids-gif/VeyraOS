---
defaultGroups:
    - name: users
      system: true
    - name: wheel
      system: true
    - name: video
      system: true
    - name: audio
      system: true
    - gamemode
# sudo for "wheel" is configured by the veyra-system package.
# (No sudoersGroup here, so no duplicate /etc/sudoers.d/10-installer.)
autologinGroup: autologin
doAutologin: false
displayAutologin: true
# Root stays locked; administrators use their own password (like Windows UAC).
setRootPassword: false
doReusePassword: false
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root, veyra, nobody, admin ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${login}-pc"
    forbidden_names: [ localhost ]
