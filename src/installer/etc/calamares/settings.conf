# VeyraOS installer (Calamares) — main configuration.
# Safety: nothing is written to disk before the Summary page, and the
# "Install now" confirmation (prompt-install) is always shown. No
# partitioning choice is preselected, so erasing a disk always requires an
# explicit choice by the user.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: veyra-post
    module: shellprocess
    config: shellprocess-veyra-post.conf
  - id: veyra-grub
    module: shellprocess
    config: shellprocess-veyra-grub.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - removeuser
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-openrc
      - shellprocess@veyra-post
      - packages
      - initcpiocfg
      - initcpio
      - grubcfg
      - shellprocess@veyra-grub
      - bootloader
      - umount
  - show:
      - finished

branding: veyra
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
