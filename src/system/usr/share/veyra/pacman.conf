# /etc/pacman.conf — VeyraOS
# See pacman.conf(5). Repositories: official Artix first (OpenRC-native
# packages take precedence), then official Arch repositories via Artix's
# artix-archlinux-support. No third-party repositories.

[options]
HoldPkg      = pacman glibc
Architecture = auto
# Never let an update replace the init system with systemd
IgnorePkg    =
NoUpgrade    =
NoExtract    =

Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm

# Signature verification is mandatory for packages.
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

[system]
Include = /etc/pacman.d/mirrorlist

[world]
Include = /etc/pacman.d/mirrorlist

[galaxy]
Include = /etc/pacman.d/mirrorlist

[lib32]
Include = /etc/pacman.d/mirrorlist

# Official Arch Linux repositories (enabled by artix-archlinux-support)
[extra]
Include = /etc/pacman.d/mirrorlist-arch

[multilib]
Include = /etc/pacman.d/mirrorlist-arch
