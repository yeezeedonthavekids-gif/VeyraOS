# VeyraOS kernel settings. Every value here has a documented reason; see
# docs/PERFORMANCE.md. No speculative "tuning".

# zram swap is fast; prefer swapping cold anonymous pages to it over dropping
# file cache (keeps apps responsive). page-cluster=0: zram has no seek cost.
vm.swappiness = 100
vm.page-cluster = 0

# Some games (e.g. via Proton: Hogwarts Legacy, CS2, Star Citizen) need many
# memory mappings. Same value as Arch Linux / SteamOS defaults.
vm.max_map_count = 2147483642

# Hardening that has no measurable desktop cost
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
fs.protected_fifos = 1
fs.protected_regular = 1
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.tcp_syncookies = 1

# Magic SysRq: allow only sync (16), remount read-only (32) and reboot (128)
# so Alt+SysRq+S/U/B can recover a frozen system without data loss.
kernel.sysrq = 176
