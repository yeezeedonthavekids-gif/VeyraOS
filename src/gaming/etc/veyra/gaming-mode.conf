# VeyraOS Gaming Mode (toggle from the system tray, VeyraOS Control, or
# `veyra-gaming-mode on|off`). Gaming Mode reduces background activity
# without stopping anything the system needs (network, audio, input, login).

# CPU: use the performance governor / energy preference while active
CPU_PERFORMANCE=yes

# OpenRC services to pause while Gaming Mode is active and restore after.
# Only services that are safe to pause belong here. Services not running are
# ignored. (cronie: scheduled jobs; cupsd: printing.)
PAUSE_SERVICES="cronie cupsd"
