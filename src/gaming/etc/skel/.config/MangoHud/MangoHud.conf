# MangoHud performance overlay (VeyraOS defaults).
# Show/hide in game: Right Shift + F12. Enable per game in Steam with the
# launch option:  mangohud %command%   (or globally in VeyraOS Control > Gaming)
legacy_layout=false
horizontal
round_corners=8
background_alpha=0.4
font_size=20
position=top-left
toggle_hud=Shift_R+F12
fps
frametime
frame_timing=1
gpu_stats
gpu_temp
cpu_stats
cpu_temp
ram
vram
fps_limit_method=late
text_color=FFFFFF
gpu_color=7C5CFF
cpu_color=34D3EE
