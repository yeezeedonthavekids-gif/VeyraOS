; VeyraOS GameMode configuration (Feral GameMode). Applied while a game runs
; under GameMode (Steam launch option: gamemoderun %command%, Lutris: enabled
; by default). See docs/GAMING.md.
[general]
; Lower nice value (higher priority) for the game process
renice=10
; Soft real-time scheduling when the CPU has >= 4 cores ("auto")
softrealtime=auto
; Keep the screen on while playing
inhibit_screensaver=1
; Use the performance CPU governor / EPP while gaming
desiredgov=performance
defaultgov=
; Disable split lock mitigation slowdown for games (kernel >= 6.0); this is a
; performance-only mitigation for a misbehaving-program detector, not a security fix.
disable_splitlock=1

[filter]
; whitelist=
; blacklist=

[gpu]
; GPU clock tweaks are off: NVIDIA boosts automatically, and manual
; overclocking can make systems unstable.
apply_gpu_optimisations=0

[custom]
; Notify when GameMode turns on/off
start=notify-send -a "Gaming" -i input-gaming "GameMode active" "CPU set to performance"
end=notify-send -a "Gaming" -i input-gaming "GameMode off" "Power settings restored"
script_timeout=5
