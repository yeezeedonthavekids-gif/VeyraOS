<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- VeyraOS font defaults. Windows font names map to metric-compatible free
     fonts so documents and web pages keep their layout. -->
<fontconfig>
  <alias binding="same"><family>Inter</family><prefer><family>Inter</family><family>Inter Variable</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Inter</family><family>Inter Variable</family><family>Noto Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family><family>Noto Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>Inter</family><family>Inter Variable</family></accept></alias>
  <alias binding="same"><family>Segoe UI Variable</family><accept><family>Inter</family><family>Inter Variable</family></accept></alias>
  <alias binding="same"><family>Consolas</family><accept><family>JetBrains Mono</family></accept></alias>
  <alias binding="same"><family>Cascadia Code</family><accept><family>Cascadia Code</family><family>JetBrains Mono</family></accept></alias>
  <alias binding="same"><family>Segoe UI Emoji</family><accept><family>Noto Color Emoji</family></accept></alias>
</fontconfig>
