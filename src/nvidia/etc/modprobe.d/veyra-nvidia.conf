# VeyraOS NVIDIA settings (harmless on systems without an NVIDIA GPU).

# Kernel modesetting + framebuffer device: required for Wayland (KDE Plasma)
# and for a flicker-free console handoff.
options nvidia_drm modeset=1 fbdev=1

# Keep VRAM contents across suspend/resume (otherwise Wayland sessions and
# games come back with corrupted graphics). The save/restore is driven by
# /usr/lib/elogind/system-sleep/veyra-nvidia (OpenRC has no systemd units).
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
