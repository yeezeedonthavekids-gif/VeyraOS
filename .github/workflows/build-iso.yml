name: Build ISO
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the build needs ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - name: Build the ISO in an Artix container
        run: |
          sudo build/build-in-docker.sh
          # the container writes as root; later steps run as the runner user
          sudo chown -R "$(id -u):$(id -g)" out
          ls -la out/
      - name: Boot-check the ISO (QEMU, UEFI, KVM)
        # informative: a hang here must not block publishing the ISO
        continue-on-error: true
        timeout-minutes: 25
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf xorriso socat imagemagick
          sudo chmod 666 /dev/kvm || true
          tests/boot/check-real-iso.sh out/*.iso out/boot-check
      - name: Upload build logs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyraos-build-logs
          path: |
            out/*.log
            out/*.packages.txt
            out/*.sha256
            out/boot-check/
      - name: Publish the ISO as a GitHub Release (download page)
        if: ${{ !cancelled() && hashFiles('out/*.iso') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          iso=$(ls *.iso)
          if [[ $GITHUB_REF == refs/tags/* ]]; then tag=$GITHUB_REF_NAME
          else tag="v2026.11-rc1-build${GITHUB_RUN_NUMBER}"; fi
          # GitHub limits release assets to 2 GiB: publish the ISO in parts
          split -b 1900M -d "$iso" "$iso.part"
          gh release create "$tag" --target "$GITHUB_SHA" --title "VeyraOS 2026.11 RC1 ($tag)" \
             --notes-file ../docs/RELEASE-NOTES.md --prerelease \
             "$iso".part* "$iso.sha256" "$iso.sha512" *.packages.txt
          echo "Download page: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
