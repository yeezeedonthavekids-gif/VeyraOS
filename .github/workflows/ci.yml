name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fast-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck desktop-file-utils libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install -q PySide6 pytest
      - name: Static checks + unit tests
        run: make test
  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and install all VeyraOS packages (Artix containers)
        run: tests/packaging/build-and-install.sh
